name: ${COMPOSE_PROJECT_NAME:-miraprep-prod}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env.prod}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE in .env.prod}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env.prod}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env.prod}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.prod}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.prod}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  minio-init:
    image: minio/mc:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.prod}
      MINIO_BUCKET: ${MINIO_BUCKET:-miraprep}
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./minio/init-bucket.sh:/usr/local/bin/init-bucket.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/init-bucket.sh"]
    restart: "no"

  ai:
    build:
      context: ../backend/ai
      args:
        EMBEDDING_MODEL: BAAI/bge-small-zh-v1.5
    restart: unless-stopped
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env.prod}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-deepseek-v4-flash}
      ANTHROPIC_GRADING_MODEL: ${ANTHROPIC_GRADING_MODEL:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.deepseek.com/anthropic}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-4096}
      GRADING_WORKER_COUNT: ${GRADING_WORKER_COUNT:-2}
      GRADING_MAX_DELIVERY_ATTEMPTS: ${GRADING_MAX_DELIVERY_ATTEMPTS:-5}
      ASR_PROVIDER: ${ASR_PROVIDER:-deepgram}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:?set DEEPGRAM_API_KEY in .env.prod}
      DEEPGRAM_ASR_MODEL: ${DEEPGRAM_ASR_MODEL:-nova-3}
      DEEPGRAM_ASR_LANGUAGE: ${DEEPGRAM_ASR_LANGUAGE:-zh-CN}
      DEEPGRAM_ASR_ENDPOINT: ${DEEPGRAM_ASR_ENDPOINT:-wss://api.deepgram.com/v1/listen}
      TTS_PROVIDER: ${TTS_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env.prod}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
      OPENAI_TTS_VOICE: ${OPENAI_TTS_VOICE:-cedar}
      BUSINESS_CALLBACK_URL: http://business:8080/api/v1/internal
      INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?set AI_INTERNAL_TOKEN in .env.prod}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.prod}
      CORS_ORIGINS: https://${DOMAIN:?set DOMAIN in .env.prod}
    depends_on:
      redis:
        condition: service_healthy
      business:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  business:
    build:
      context: ../backend/business
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?set MYSQL_DATABASE in .env.prod}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USER: ${MYSQL_USER:?set MYSQL_USER in .env.prod}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env.prod}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.prod}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN:?set DOMAIN in .env.prod}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.prod}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-1209600}
      OSS_ENDPOINT: http://minio:9000
      OSS_BUCKET: ${MINIO_BUCKET:-miraprep}
      OSS_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.prod}
      OSS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.prod}
      AI_SERVICE_BASE_URL: http://ai:8000
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?set AI_INTERNAL_TOKEN in .env.prod}
      MAIL_MODE: ${MAIL_MODE:-smtp}
      MAIL_HOST: ${MAIL_HOST:?set MAIL_HOST in .env.prod}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?set MAIL_USERNAME in .env.prod}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?set MAIL_PASSWORD in .env.prod}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM in .env.prod}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      MAIL_SMTP_CONNECTION_TIMEOUT: ${MAIL_SMTP_CONNECTION_TIMEOUT:-5000}
      MAIL_SMTP_READ_TIMEOUT: ${MAIL_SMTP_READ_TIMEOUT:-5000}
      MAIL_SMTP_WRITE_TIMEOUT: ${MAIL_SMTP_WRITE_TIMEOUT:-5000}
      VERIFICATION_SEND_WINDOW: ${VERIFICATION_SEND_WINDOW:-3600}
      VERIFICATION_SEND_IP_MAX_ATTEMPTS: ${VERIFICATION_SEND_IP_MAX_ATTEMPTS:-20}
      VERIFICATION_SEND_RECIPIENT_MAX_ATTEMPTS: ${VERIFICATION_SEND_RECIPIENT_MAX_ATTEMPTS:-5}
      VERIFICATION_SEND_GLOBAL_MAX_ATTEMPTS: ${VERIFICATION_SEND_GLOBAL_MAX_ATTEMPTS:-1000}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${DOMAIN:?set DOMAIN in .env.prod}/api/v1
        NEXT_PUBLIC_AI_STREAM_URL: https://${DOMAIN:?set DOMAIN in .env.prod}
    restart: unless-stopped
    depends_on:
      business:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.prod}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.prod}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      business:
        condition: service_healthy
      ai:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
