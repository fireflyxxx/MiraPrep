spring:
  application:
    name: miraprep-business
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/miraprep}
    username: ${DB_USER:miraprep}
    password: ${DB_PASSWORD:change-me-mysql-password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_SMTP_READ_TIMEOUT:5000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:5000}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
            required: ${MAIL_SMTP_STARTTLS:true}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8080
  forward-headers-strategy: framework

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  internal-token: ${AI_INTERNAL_TOKEN:}
  storage:
    endpoint: ${OSS_ENDPOINT:http://localhost:9000}
    access-key: ${OSS_ACCESS_KEY:miraprep-admin}
    secret-key: ${OSS_SECRET_KEY:change-me-minio-password}
    bucket: ${OSS_BUCKET:miraprep}
    download-url-expiry-seconds: ${OSS_DOWNLOAD_URL_EXPIRY_SECONDS:900}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
  share:
    # 分享链接是给别人点的，所以拼的是前端站点地址，不是后端 API 地址。
    base-url: ${SHARE_BASE_URL:http://localhost:3000}
  resume:
    upload-window: ${RESUME_UPLOAD_WINDOW:3600}
    upload-max-attempts: ${RESUME_UPLOAD_MAX_ATTEMPTS:10}
  interview:
    create-window: ${INTERVIEW_CREATE_WINDOW:3600}
    create-max-attempts: ${INTERVIEW_CREATE_MAX_ATTEMPTS:20}
  auth:
    jwt-secret: ${JWT_SECRET:local-development-secret-must-be-replaced-in-production-12345}
    access-ttl: ${JWT_ACCESS_TTL:900}
    refresh-ttl: ${JWT_REFRESH_TTL:1209600}
    verification:
      ttl: ${VERIFICATION_CODE_TTL:600}
      resend-ttl: ${VERIFICATION_CODE_RESEND_TTL:60}
      max-attempts: ${VERIFICATION_CODE_MAX_ATTEMPTS:5}
      fixed-code: ${VERIFICATION_FIXED_CODE:}
      send-window: ${VERIFICATION_SEND_WINDOW:3600}
      send-ip-max-attempts: ${VERIFICATION_SEND_IP_MAX_ATTEMPTS:20}
      send-recipient-max-attempts: ${VERIFICATION_SEND_RECIPIENT_MAX_ATTEMPTS:5}
      send-global-max-attempts: ${VERIFICATION_SEND_GLOBAL_MAX_ATTEMPTS:1000}
      mail-mode: ${MAIL_MODE:console}
      mail-from: ${MAIL_FROM:MiraPrep <no-reply@localhost>}
    oauth:
      google:
        # 留空即关闭 Google 登录：前端不渲染按钮，后端一律拒绝（见 GoogleOAuthService）。
        client-id: ${GOOGLE_CLIENT_ID:}
        # 可覆盖，测试用本地桩服务顶掉真实 Google。
        tokeninfo-base-url: ${GOOGLE_TOKENINFO_BASE_URL:https://oauth2.googleapis.com}
      github:
        # client-id 与前端同值；secret 只留后端。任一为空即关闭 GitHub 登录。
        client-id: ${GITHUB_CLIENT_ID:}
        client-secret: ${GITHUB_CLIENT_SECRET:}
        oauth-base-url: ${GITHUB_OAUTH_BASE_URL:https://github.com}
        api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    login-window: ${LOGIN_RATE_LIMIT_WINDOW:60}
    login-max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
    token-store: ${AUTH_TOKEN_STORE:redis}
    rate-limiter: ${AUTH_RATE_LIMITER:redis}
